<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Few Gifts — For You</title>
<link rel="stylesheet" href="style.css">
<style>
  .gift-row{
    display:flex; gap: clamp(1rem, 4vw, 2rem); justify-content:center;
    flex-wrap: wrap; margin-top: 1.5rem;
  }
  .gift-box{
    background: none; border: none; cursor: pointer; padding: 0;
    display:flex; flex-direction:column; align-items:center; gap:.6rem;
    width: 140px;
  }
  .gift-box svg{ width: 110px; height: 110px; transition: transform .2s ease; filter: drop-shadow(0 10px 18px var(--shadow-soft)); }
  .gift-box:hover svg{ transform: translateY(-4px) rotate(-2deg); }
  .gift-box.opened svg{ opacity: .45; transform: none; }
  .gift-box .label{ font-family: var(--font-display); font-weight:600; color: var(--plum); font-size: .88rem; text-align:center; }
  .lid{ transition: transform .35s cubic-bezier(.3,1.6,.4,1); transform-origin: 50% 62px; }
  .gift-box.opened .lid{ transform: translateY(-18px) rotate(-18deg); }

  .modal-overlay{
    position: fixed; inset: 0; z-index: 80;
    background: rgba(92,42,62,.38);
    display:flex; align-items:center; justify-content:center;
    padding: 1.2rem;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal-overlay.show{ opacity: 1; pointer-events: auto; }
  .modal-card{
    background: var(--paper); border-radius: 22px;
    padding: clamp(1.6rem, 5vw, 2.4rem) clamp(1.4rem, 5vw, 2rem);
    max-width: 440px; width: 100%;
    box-shadow: 0 24px 60px rgba(92,42,62,.35);
    text-align: center; position: relative;
    transform: scale(.92) translateY(8px);
    transition: transform .3s cubic-bezier(.2,1.4,.4,1);
  }
  .modal-overlay.show .modal-card{ transform: scale(1) translateY(0); }
  .modal-close{
    position: absolute; top: .7rem; right: .9rem;
    background: none; border: none; cursor: pointer;
    font-size: 1.5rem; line-height: 1; color: var(--gold-deep);
    padding: .3rem;
  }
  .modal-card h3{ font-size: 1.15rem; }
  .modal-card p{ color: var(--ink); }
</style>
</head>
<body data-page="gifts">

<div class="spark-field" aria-hidden="true"></div>

<a class="back-link" href="birthday.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
  back
</a>

<main>
  <section class="hero" style="padding-top: 3rem;">
    <span class="eyebrow">✨ a little unwrapping</span>
    <h1>Open these<br>whenever you're ready</h1>
    <p class="lede">Three tiny gifts, no wrapping paper mess. Tap a box.</p>
  </section>

  <section class="card">
    <div class="gift-row" id="giftRow">
      <button class="gift-box" data-gift="1" aria-label="Open first gift">
        <svg viewBox="0 0 100 100">
          <rect x="18" y="46" width="64" height="42" rx="4" fill="#FF9EC4"/>
          <rect x="44" y="46" width="12" height="42" fill="#FFE1EC"/>
          <g class="lid">
            <rect x="14" y="34" width="72" height="16" rx="4" fill="#E14C7C"/>
            <rect x="44" y="34" width="12" height="16" fill="#FFE1EC"/>
            <path d="M50 34c-6-14-24-14-22-2 1 6 12 4 22 2z" fill="#E14C7C"/>
            <path d="M50 34c6-14 24-14 22-2-1 6-12 4-22 2z" fill="#E14C7C"/>
          </g>
        </svg>
        <span class="label">On ordinary days</span>
      </button>

      <button class="gift-box" data-gift="2" aria-label="Open second gift">
        <svg viewBox="0 0 100 100">
          <rect x="18" y="46" width="64" height="42" rx="4" fill="#FFC2DA"/>
          <rect x="44" y="46" width="12" height="42" fill="#FFF0F5"/>
          <g class="lid">
            <rect x="14" y="34" width="72" height="16" rx="4" fill="#D98BA0"/>
            <rect x="44" y="34" width="12" height="16" fill="#FFF0F5"/>
            <path d="M50 34c-6-14-24-14-22-2 1 6 12 4 22 2z" fill="#D98BA0"/>
            <path d="M50 34c6-14 24-14 22-2-1 6-12 4-22 2z" fill="#D98BA0"/>
          </g>
        </svg>
        <span class="label">When you're hard on yourself</span>
      </button>

      <button class="gift-box" data-gift="3" aria-label="Open third gift">
        <svg viewBox="0 0 100 100">
          <rect x="18" y="46" width="64" height="42" rx="4" fill="#FF6F9C"/>
          <rect x="44" y="46" width="12" height="42" fill="#FFDCEA"/>
          <g class="lid">
            <rect x="14" y="34" width="72" height="16" rx="4" fill="#B85F7D"/>
            <rect x="44" y="34" width="12" height="16" fill="#FFDCEA"/>
            <path d="M50 34c-6-14-24-14-22-2 1 6 12 4 22 2z" fill="#B85F7D"/>
            <path d="M50 34c6-14 24-14 22-2-1 6-12 4-22 2z" fill="#B85F7D"/>
          </g>
        </svg>
        <span class="label">A small promise</span>
      </button>
    </div>

  </section>

  <div class="modal-overlay" id="giftModal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="heart-divider" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#FF9EC4"><path d="M12 21s-7.5-4.6-10.2-9C-0.4 8.6 1.6 4 5.7 4c2.1 0 3.6 1.1 4.3 2.4C10.7 5.1 12.2 4 14.3 4c4.1 0 6.1 4.6 3.9 8-2.7 4.4-10.2 9-10.2 9z"/></svg>
      </div>
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
    </div>
  </div>

  <section class="card" style="text-align:center; margin-top:1.1rem;">
    <h2 style="font-size:1.2rem;">Need a one-line boost?</h2>
    <p style="color:#a97b8c; margin-bottom:1.1rem;">Pull a tiny note out of thin air.</p>
    <button class="btn secondary" id="pullNote">Pull a note</button>
    <p id="noteOutput" class="speech" style="display:none; margin-top:1.2rem;"></p>
  </section>
</main>

<div class="next-wrap">
  <a class="btn next-btn" href="cake.html">
    <span class="next-btn-inner">
      <span class="sub">Next up</span>
      <span>Next →</span>
    </span>
  </a>
</div>

<footer>made with a lot of feelings, just for you</footer>

<script src="script.js"></script>
<script>
  const giftContent = {
    1: {
      title: "On ordinary days",
      text: "Most of what I love about you is the ordinary version of you. The way u talk, those weird silly things, the way a boring day becomes gud. I notice all of it, even when I don't say so."
    },
    2: {
      title: "When you're hard on yourself",
      text: "here's your reminder from me, you're da best. you're doing better than you think you are my love, i love you and im proud of u. HAPPY BIRTHDAYYYY!!!!!!!😝"
    },
    3: {
      title: "A small promise",
      text: "I'm not going anywhere. On your loud days and your quiet days, your confident days and your unsure ones, I'm choosing you on all of them, on purpose, again and again. That's not a one time thing I'm saying today it's just true, every day, on repeat😛😛"
    }
  };

  const modal = document.getElementById('giftModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalClose = document.getElementById('modalClose');

  function openModal(n){
    const data = giftContent[n];
    modalTitle.textContent = data.title;
    modalText.textContent = data.text;
    modal.classList.add('show');
  }

  function closeModal(){
    modal.classList.remove('show');
  }

  document.querySelectorAll('.gift-box').forEach(box => {
    box.addEventListener('click', () => {
      box.classList.add('opened');
      openModal(box.dataset.gift);
    });
  });

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if(e.target === modal) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  const notes = [
    "You make ordinary days feel like good ones.",
    "you're my favourite notification sanu😻",
    "You're doing better than u think hehe",
    "i would choose you in every universe my love."
  ];
  const btn = document.getElementById('pullNote');
  const out = document.getElementById('noteOutput');
  btn.addEventListener('click', () => {
    const pick = notes[Math.floor(Math.random() * notes.length)];
    out.textContent = pick;
    out.style.display = 'block';
  });
</script>
</body>
</html>
